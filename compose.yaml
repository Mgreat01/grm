name: gemedical

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grm}
      POSTGRES_USER: ${POSTGRES_USER:-grm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env.docker}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  database-init:
    build:
      context: .
    restart: "no"
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grm}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-grm}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur GRM}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Définissez ADMIN_EMAIL dans .env.docker}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définissez ADMIN_PASSWORD dans .env.docker}
    depends_on:
      database:
        condition: service_healthy

  scheduler:
    build:
      context: ../grm-s/ai-scheduler-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grm}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-grm}
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('net').connect(50051,'127.0.0.1');n.on('connect',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-grm}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-grm}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env.docker}
      SCHEDULER_GRPC_ADDRESS: scheduler:50051
      SCHEDULER_GRPC_TIMEOUT_MS: ${SCHEDULER_GRPC_TIMEOUT_MS:-10000}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080}
      smtp_host: mailpit
      smtp_port: 1025
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      database-init:
        condition: service_completed_successfully
      scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ../fgm/gemedical-app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
